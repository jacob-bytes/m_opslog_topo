name: rust-diff

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust renderer tests
        run: cargo test --quiet --manifest-path rust/topo-render/Cargo.toml

      - name: Python/Rust differential test
        run: python3 -m unittest discover -s tests -p "test_differential.py" -v
